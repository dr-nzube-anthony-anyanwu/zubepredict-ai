[project]
name = "zubepredict-ai"
version = "0.1.0"
description = "Stage-based autonomous data-science starter platform"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "pandas>=2.2,<3",
  "numpy>=1.26,<2.3",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "openpyxl>=3.1,<4",
  "reportlab>=4.2,<5",
  "xlrd>=2,<3",
  "pyarrow>=18,<21",
  "joblib>=1.4,<2",
  "redis>=5.2,<6",
  "dramatiq[redis]>=1.17,<2",
  "structlog>=24.4,<26",
  "tenacity>=9,<10",
  "orjson>=3.10,<4",
  "aiogram>=3.17,<4",
  "supabase>=2.11,<3",
  "langgraph>=0.2,<1",
  "langchain-core>=0.3,<1",
]

[project.optional-dependencies]
ml = [
  "xgboost>=2.1,<4",
  "lightgbm>=4.5,<5",
  "catboost>=1.2,<2",
  "imbalanced-learn>=0.13,<1",
  "optuna>=4,<5",
  "shap>=0.46,<1",
  "numba>=0.61,<0.62",
  "statsmodels>=0.14,<1",
  "plotly>=5.24,<7",
  "matplotlib>=3.9,<4",
  "seaborn>=0.13,<1",
  "skops>=0.14,<0.16",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "packages", "apps/api"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"] # FastAPI uses File/Form dependency markers in signatures.

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
